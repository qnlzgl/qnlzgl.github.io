<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaceNow</title>
<style>
  :root { color-scheme: light dark; --fg:#1d1d1f; --muted:#6e6e73; --bg:#ffffff; --link:#0a58ca; }

  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:40px 20px 64px; }
  h1 { font-size:32px; margin:0 0 6px; }
  p { margin:10px 0; }
    a { color:var(--link); }
</style>
</head>
<body>
<main>
  <h1>PaceNow</h1>
  <p>Real-time running pace on your iPhone, no watch needed. Fast, accurate and simple.</p>

  <p><strong>Support:</strong> open an issue at <a href="https://github.com/qnlzgl/qnlzgl.github.io/issues">github.com/qnlzgl/qnlzgl.github.io/issues</a>. Issues are public, so please do not include personal information.</p>

  <p><a href="privacy/">Privacy Policy</a></p>
</main>

</html>
