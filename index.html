<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps</title>
<style>
  :root { color-scheme: light dark; --fg:#1d1d1f; --muted:#6e6e73; --bg:#ffffff; --link:#0a58ca; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f5f5f7; --muted:#a1a1a6; --bg:#111113; --link:#6cb0ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:40px 20px 64px; }
  h1 { font-size:32px; margin:0 0 12px; }
  li { margin:8px 0; }
  .muted { color:var(--muted); }
  a { color:var(--link); }
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <ul>
    <li><a href="pacenow/"><strong>PaceNow</strong></a> <span class="muted">· real-time running pace on your iPhone</span></li>
  </ul>
</main>
</body>
</html>
